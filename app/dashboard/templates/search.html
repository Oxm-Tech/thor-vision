<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buscar · THOR Vision</title>
<style>
:root{color-scheme:dark;--bg:#0e1117;--panel:#161b24;--line:#252c3a;--text:#e8edf3;--muted:#8b949e;--accent:#76B900}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line)}header a{color:var(--muted);text-decoration:none;font-size:13px}h1{font-size:17px;margin:0;flex:1}
main{max-width:1400px;margin:0 auto;padding:12px 16px 60px;display:grid;gap:12px}
form{display:flex;gap:8px;flex-wrap:wrap}input,select,button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit;min-height:40px}input{flex:1;min-width:240px}button{cursor:pointer;background:var(--accent);color:#0b0f15;border-color:var(--accent);font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.cols{grid-template-columns:1fr}}
.col h3{margin:0 0 8px;font-size:15px;display:flex;gap:8px;align-items:center}.col h3 small{color:var(--muted);font-weight:400}
.card{display:grid;grid-template-columns:150px 1fr;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}.card.noimg{grid-template-columns:1fr}
.card img{width:150px;height:100px;object-fit:cover;border-radius:6px;background:#000}.meta{color:var(--muted);font-size:12px}.txt{font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.grid .card{display:block;padding:4px}.grid img{width:100%;height:150px}
.muted{color:var(--muted);font-size:12.5px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}.chip:hover{border-color:var(--accent)}
</style>
</head>
<body>
<header><a href="/">← Panel</a><h1>Buscar en el historial</h1><span class="muted" id="st"></span></header>
<main>
  <form id="f"><input id="q" placeholder="Describe lo que buscas, p. ej. alguien revisando la puerta de un coche" autofocus>
    <select id="kind"><option value="event">Eventos (descripciones)</option><option value="visit">Personas por su apariencia</option></select>
    <select id="hours"><option value="24">24 h</option><option value="72">3 días</option><option value="168" selected>7 días</option><option value="720">30 días</option></select><button>Buscar</button></form>
  <div class="chips" id="ej"></div>
  <p class="muted" style="margin:0">A la izquierda, la búsqueda por palabras de antes; a la derecha, la nueva (palabras + significado con EmbeddingGemma 2). Las coincidencias por apariencia son una pista visual, no una identificación.</p>
  <div id="out"></div>
</main>
<script>
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let NAMES = {};
fetch('/api/cameras').then(r => r.json()).then(d => { (d.cameras || d).forEach?.(c => { NAMES[c.id] = c.name; }); }).catch(() => {});
['alguien revisando la puerta de un coche', 'persona con capucha en la banqueta', 'alguien sentado frente a una laptop de madrugada', 'un perro dentro de la casa', 'varias personas reunidas'].forEach(t => {
  const c = document.createElement('span'); c.className = 'chip'; c.textContent = t; c.onclick = () => { $('#q').value = t; $('#f').requestSubmit(); }; $('#ej').appendChild(c);
});
const when = ts => new Date(ts * 1000).toLocaleString('es-MX', {day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false});
const card = r => `<div class="card${r.snapshot_id ? '' : ' noimg'}">${r.snapshot_id ? `<a href="/api/snapshots/file/${r.snapshot_id}" target="_blank"><img loading="lazy" src="/api/snapshots/file/${r.snapshot_id}?w=320" alt=""></a>` : ''}<div><div class="meta">${esc(NAMES[r.cam] || r.cam)} · ${when(r.ts)}</div><div class="txt">${esc(r.text)}</div></div></div>`;
async function go(e){
  e.preventDefault(); const q = $('#q').value.trim(); if (!q) return; $('#out').innerHTML = '<p class="muted">Buscando…</p>';
  const hours = $('#hours').value;
  if ($('#kind').value === 'visit') {
    const t0 = performance.now(); const d = await (await fetch(`/api/search/semantic?q=${encodeURIComponent(q)}&kind=visit&hours=${hours}&k=24`)).json();
    $('#st').textContent = ((performance.now() - t0) / 1000).toFixed(1) + ' s';
    $('#out').innerHTML = d.results.length ? `<div class="grid">${d.results.map(r => `<div class="card"><a href="${r.image}" target="_blank"><img loading="lazy" src="${r.image}" alt=""></a><div class="meta">similitud ${r.score}</div></div>`).join('')}</div>` : '<p class="muted">Sin resultados (el indexado de personas puede seguir en curso).</p>';
    return;
  }
  const t0 = performance.now();
  const [a, b] = await Promise.all(['fts', 'hybrid'].map(m => fetch(`/api/search/semantic?q=${encodeURIComponent(q)}&mode=${m}&hours=${hours}&k=12`).then(r => r.json())));
  $('#st').textContent = ((performance.now() - t0) / 1000).toFixed(1) + ' s';
  const col = (t, s, d) => `<div class="col"><h3>${t} <small>${s}</small></h3>${d.results.length ? d.results.map(card).join('') : '<p class="muted">Sin resultados.</p>'}</div>`;
  $('#out').innerHTML = `<div class="cols">${col('Antes', 'palabras', a)}${col('Ahora', 'palabras + significado', b)}</div>`;
}
$('#f').addEventListener('submit', go);
</script>
</body>
</html>
